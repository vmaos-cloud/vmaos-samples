<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>群控教程</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/sdk/styles.css"></head>
<body><header><h1>云机群控</h1><div class="credential-panel"><div id="credential-warning" class="credential-warning" role="note"><strong>仅限本机调试 · AK/SK 凭据</strong><p>这里输入 AK/SK 只是为了方便本机调试。<b>生产环境必须将 AK/SK 保存在后端服务器，由后端签名调用 OpenAPI。</b>不要写入前端代码、浏览器存储或公开页面。</p></div><form id="login" aria-describedby="credential-warning"><label>AK <input name="accessKey" autocomplete="off" required></label><label>SK <input name="secretKey" type="password" autocomplete="off" required></label><button>连接并查询云机</button></form><p class="credential-help">输入后提交给本例同源后端，AK/SK 保留在当前页面输入框中，方便重复调试；点击“退出并清除凭据”后清空。</p></div>
<div class="toolbar"><button id="reload" disabled>重新查询</button><button id="more" disabled>加载更多</button><button id="start" disabled>群控所选云机</button><button id="stop">断开群控</button><button id="logout">退出并清除凭据</button><label><input id="sync" type="checkbox" checked>同步操作</label><button id="retry-main">重试主控</button><button id="retry-followers">重试从控</button><button id="retry-previews">重新获取预览</button><span id="message" role="status"></span></div></header>
<main><section id="list"><table><thead><tr><th>选择</th><th>云机编号</th><th>运行状态</th><th>在线</th></tr></thead><tbody id="phones"></tbody></table></section>
<section id="workspace" hidden><aside><strong id="primary-name"></strong><span id="primary-status" role="status">已断开</span><span id="follower-status" role="status">从控控制未连接</span><div id="primary"></div><nav><button id="back" data-primary-action disabled>返回</button><button id="home" data-primary-action disabled>主页</button><button id="task" data-primary-action disabled>最近任务</button></nav><div id="camera-controls"></div></aside><div id="followers" tabindex="0" aria-label="从控列表"></div></section></main>
<script src="/sdk/browser.iife.js"></script><script type="module" src="/main.js"></script></body></html>
